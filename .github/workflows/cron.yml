name: ROC Aufraeum-Job

# Stoesst alle 15 Minuten den Aufraeum-Job an: abgelaufene 24h-Reservierungen
# freigeben und faellige Auktionen beenden. Laeuft auf GitHub, unabhaengig vom
# Vercel-Plan.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cron-Route anstossen
        run: |
          curl -fsS --max-time 30 -X POST \
            "https://rideout-kappa.vercel.app/api/cron?key=${{ secrets.CRON_SECRET }}"
