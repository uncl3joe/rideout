name: Changelog nach Discord

# Postet den neuesten Changelog-Eintrag automatisch in einen Discord-Channel,
# sobald die CHANGELOG.md geaendert und hochgeladen wurde.
on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4
      - name: Neuesten Eintrag posten
        env:
          HOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: node .github/scripts/post-changelog.js
